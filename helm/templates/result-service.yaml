apiVersion: v1
kind: Service
metadata:
  name: result
  labels:
    app: result
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.result.service.type }}
  ports:
    - name: result-service
      port: {{ .Values.result.service.port }}
      targetPort: {{ .Values.result.service.targetPort }}
      nodePort: {{ .Values.result.service.nodePort }}
      protocol: TCP
  selector:
    app: result
