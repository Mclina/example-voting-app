apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    app: result
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.result.replicaCount }}
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
        - name: result
          image: "{{ .Values.result.image.repository }}:{{ .Values.result.image.tag }}"
          imagePullPolicy: {{ .Values.result.image.pullPolicy }}
          ports:
            - name: result
              containerPort: 80
              protocol: TCP
