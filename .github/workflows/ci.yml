name: Voting App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build vote result worker

  integration-test:
    name: Test voting application
    runs-on: ubuntu-latest
    needs: validate-compose

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start application
        run: docker compose up -d --build

      - name: Scan vote image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'example-voting-app-vote:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Scan result image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'example-voting-app-result:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Scan worker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'example-voting-app-worker:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Wait for application endpoints
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ >/dev/null &&
               curl -fsS http://localhost:8081/ >/dev/null; then
              echo "Both application pages are responding."
              exit 0
            fi

            echo "Waiting for application pages ($attempt/30)..."
            sleep 2
          done

          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Submit a test vote
        run: |
          curl --fail --silent --show-error \
            -X POST \
            --data "vote=b" \
            http://localhost:8080/ \
            -o /dev/null

      - name: Verify vote is saved in PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            count=$(docker compose exec -T db \
              psql -U postgres -d postgres -tAc \
              "SELECT COUNT(*) FROM votes WHERE vote = 'b';" \
              2>/dev/null | tr -d '[:space:]')

            if [ "${count:-0}" -ge 1 ] 2>/dev/null; then
              echo "PASS: Test vote was saved in PostgreSQL."
              exit 0
            fi

            echo "Waiting for the worker to save the vote ($attempt/30)..."
            sleep 2
          done

          echo "FAIL: Test vote was not found in PostgreSQL."
          docker compose logs --no-color worker db vote
          exit 1

      - name: Stop test application
        if: always()
        run: docker compose down --volumes --remove-orphans
